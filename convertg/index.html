<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TTA Xiaomi Global Firmware Hub</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome 6 Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #f5f8ff;
            --card-bg: rgba(255, 255, 255, 0.92);
            --border-color: #e4eaf5;
            --accent-blue: #3978f6;
            --accent-green: #16a36a;
            --accent-purple: #8055e8;
            --accent-orange: #f59e0b;
            --text-main: #17233d;
            --text-muted: #66748b;
        }

        * { box-sizing: border-box; }

        body {
            background-color: var(--bg-color);
            background-image:
                radial-gradient(at 0% 0%, rgba(57, 120, 246, 0.14) 0px, transparent 42%),
                radial-gradient(at 100% 10%, rgba(168, 85, 247, 0.12) 0px, transparent 38%),
                radial-gradient(at 80% 100%, rgba(14, 165, 233, 0.10) 0px, transparent 42%);
            background-attachment: fixed;
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            min-height: 100vh;
        }

        .hero-section {
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, rgba(255,255,255,0.98), rgba(241,247,255,0.95));
            border: 1px solid rgba(255,255,255,0.95);
            border-radius: 26px;
            padding: 38px 20px;
            box-shadow: 0 18px 50px rgba(43, 75, 130, 0.10);
        }

        .hero-section::before {
            content: "";
            position: absolute;
            width: 220px;
            height: 220px;
            top: -130px;
            right: -60px;
            border-radius: 50%;
            background: linear-gradient(135deg, rgba(57,120,246,.18), rgba(168,85,247,.12));
            pointer-events: none;
        }

        .hero-section h1 {
            color: #17233d;
            letter-spacing: -0.7px;
        }

        .hero-section p {
            color: #68758b !important;
        }

        .search-container {
            position: relative;
            max-width: 650px;
            margin: 0 auto;
        }

        .search-input {
            background: #ffffff !important;
            border: 1px solid #dce5f2 !important;
            color: #17233d !important;
            padding: 15px 20px 15px 50px;
            border-radius: 50px;
            font-size: 1rem;
            box-shadow: 0 8px 24px rgba(39, 73, 125, 0.07);
            transition: all 0.25s ease;
        }

        .search-input::placeholder { color: #96a2b5; }

        .search-input:focus {
            border-color: var(--accent-blue) !important;
            box-shadow: 0 0 0 4px rgba(57, 120, 246, 0.12) !important;
        }

        .search-icon {
            position: absolute;
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: #8090a8;
        }

        .firmware-card {
            position: relative;
            overflow: hidden;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 22px;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 8px 26px rgba(35, 64, 110, 0.055);
            transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
        }

        .firmware-card::before {
            content: "";
            position: absolute;
            top: 0;
            left: 22px;
            right: 22px;
            height: 3px;
            border-radius: 0 0 8px 8px;
            background: linear-gradient(90deg, #3978f6, #8b5cf6, #06b6d4);
            opacity: 0.8;
        }

        .firmware-card:hover {
            transform: translateY(-5px);
            border-color: #c9d9f8;
            box-shadow: 0 18px 36px rgba(57, 120, 246, 0.13);
        }

        .model-title {
            font-size: 1.2rem;
            font-weight: 700;
            color: #17233d;
            margin-bottom: 8px;
            overflow-wrap: anywhere;
        }

        .badge-region {
            background: linear-gradient(135deg, #edf4ff, #f3efff);
            color: #426bd0;
            border: 1px solid #dce7ff;
            font-weight: 700;
            border-radius: 9px;
            padding: 6px 12px;
            font-size: 0.75rem;
            display: inline-block;
        }

        .btn-custom {
            border-radius: 11px;
            font-weight: 700;
            font-size: 0.85rem;
            padding: 10px 14px;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-decoration: none;
            width: 100%;
        }

        .btn-drive-1 {
            background: #eaf9f0;
            color: #16834f;
            border: 1px solid #c9efd8;
        }

        .btn-drive-1:hover {
            background: #16a36a;
            border-color: #16a36a;
            color: #ffffff;
            transform: translateY(-1px);
        }

        .btn-drive-2 {
            background: #f1edff;
            color: #7045d4;
            border: 1px solid #dfd5ff;
        }

        .btn-drive-2:hover {
            background: #8055e8;
            border-color: #8055e8;
            color: #ffffff;
            transform: translateY(-1px);
        }

        .btn-video {
            background: #fff5e5;
            color: #b66a00;
            border: 1px solid #ffe3b3;
        }

        .btn-video:hover {
            background: #f59e0b;
            border-color: #f59e0b;
            color: #ffffff;
            transform: translateY(-1px);
        }

        .btn-contact {
            background: linear-gradient(110deg, #3478f6, #7258e8 55%, #9b55df);
            color: #ffffff;
            border: 0;
            border-radius: 50px;
            box-shadow: 0 8px 20px rgba(91, 94, 220, 0.24);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn-contact:hover {
            color: #ffffff;
            transform: translateY(-2px);
            box-shadow: 0 12px 26px rgba(91, 94, 220, 0.32);
        }

        #loading .spinner-border { color: var(--accent-blue) !important; }

        .alert-danger {
            background: #fff1f2;
            color: #be123c;
            border-color: #fecdd3;
        }

        ::-webkit-scrollbar { width: 9px; }
        ::-webkit-scrollbar-track { background: #edf1f8; }
        ::-webkit-scrollbar-thumb {
            background: linear-gradient(#8da9e8, #b3a0e9);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover { background: #718bd0; }

        @media (max-width: 576px) {
            .container.py-5 { padding-top: 1.5rem !important; padding-bottom: 1.5rem !important; }
            .hero-section { padding: 28px 16px; border-radius: 20px; }
            .hero-section h1 { font-size: 1.65rem; }
            .firmware-card { padding: 20px; }
        }
    </style>
</head>
<body>

<div class="container py-5">
    
    <!-- Hero Header -->
    <div class="hero-section text-center mb-5">
        <h1 class="fw-bold mb-2">
            <i class="fa-solid fa-microchip text-primary me-2"></i>TTA Xiaomi Global Firmware
        </h1>

<p class="text-secondary mb-4">
  Download ဆွဲတဲ့အခါ
  <span style="color: red; font-weight: 600;">Google Drive quota exceeded 24 hours Limit</span>
  စာမျိုး တက်ပြီး Download မရဖြစ်နေပါက browser မှာ Gmail.com သွားပြီး Google အကောင့်တစ်ခု အရင်ဝင်ပေးပါ။
  ပြီးမှ link ကို paste ချပီး ဒေါင်းပေးပါ။
</p>

        
        <!-- Search Box -->
        <div class="search-container">
            <i class="fa-solid fa-magnifying-glass search-icon"></i>
            <input type="text" id="searchInput" class="form-control search-input" placeholder="Search device model (e.g., Redmi 14C, Note 13 Pro)..." onkeyup="filterModels()">
        </div>

        <!-- Contact Button: Replace the URL below with your contact link -->
        <div class="mt-3">
            <a href="https://t.me/thantoeaungat" target="_blank" rel="noopener noreferrer"
               class="btn btn-contact px-4 py-2 fw-semibold">
                <i class="fa-solid fa-headset me-2"></i>ဆက်သွယ်ရန်
            </a>
        </div>
    </div>

    <!-- Loading Spinner -->
    <div id="loading" class="text-center py-5">
        <div class="spinner-border text-primary" style="width: 3rem; height: 3rem;" role="status"></div>
        <p class="mt-3 text-secondary fs-6">Loading Firmware Database...</p>
    </div>

    <!-- Firmware Cards Container -->
    <div class="row g-4" id="firmwareContainer"></div>

</div>

<script>
    // Google Apps Script Web App URL
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby_zHZqtx1PQfC2TKARaSQWMMlx-FCEFrOrFoauSMrWTMVytG-fKcLe4L6VfPcvv3YU/exec";

    let firmwareData = [];

    async function fetchFirmware() {
        try {
            const response = await fetch(SCRIPT_URL);
            firmwareData = await response.json();
            document.getElementById('loading').style.display = 'none';
            renderCards(firmwareData);
        } catch (error) {
            console.error("Error fetching data:", error);
            document.getElementById('loading').innerHTML = `
                <div class="alert alert-danger d-inline-block px-4 py-2" role="alert">
                    <i class="fa-solid fa-triangle-exclamation me-2"></i> Data ရယူရာတွင် အမှားအယွင်းရှိနေပါသည်။ ခဏအကြာမှ ထပ်မံကြိုးစားပါ။
                </div>`;
        }
    }

    function renderCards(data) {
        const container = document.getElementById('firmwareContainer');
        container.innerHTML = '';

        if (!data || data.length === 0) {
            container.innerHTML = `
                <div class="col-12 text-center text-secondary py-5">
                    <i class="fa-regular fa-folder-open fa-3x mb-3 d-block"></i>
                    ရှာဖွေမှုနှင့် ကိုက်ညီသော Firmware မရှိပါ။
                </div>`;
            return;
        }

        data.forEach(item => {
            if (!item.model) return; // Row အလွတ်များကို ကျော်မည်

            let link1Btn = item.link1 ? `<a href="${item.link1}" target="_blank" class="btn-custom btn-drive-1 mb-2"><i class="fa-solid fa-cloud-arrow-down"></i> Drive Link 1</a>` : '';
            let link2Btn = item.link2 ? `<a href="${item.link2}" target="_blank" class="btn-custom btn-drive-2 mb-2"><i class="fa-solid fa-cloud-arrow-down"></i> Drive Link 2</a>` : '';
            let videoBtn = item.video ? `<a href="${item.video}" target="_blank" class="btn-custom btn-video mb-2"><i class="fa-circle-play fa-solid"></i> Download ဆွဲနည်း Video</a>` : '';

            let cardHTML = `
                <div class="col-md-6 col-lg-4 firmware-item">
                    <div class="firmware-card">
                        <div>
                            <div class="d-flex justify-content-between align-items-start mb-2">
                                <h3 class="model-title mb-0">${item.model}</h3>
                            </div>
                            <span class="badge-region mb-3">
                                <i class="fa-solid fa-globe me-1"></i>${item.region || 'Global Change'}
                            </span>
                        </div>
                        <div class="mt-3">
                            ${link1Btn}
                            ${link2Btn}
                            ${videoBtn}
                        </div>
                    </div>
                </div>
            `;
            container.innerHTML += cardHTML;
        });
    }

    function filterModels() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        const filtered = firmwareData.filter(item => 
            (item.model && item.model.toLowerCase().includes(query)) || 
            (item.region && item.region.toLowerCase().includes(query))
        );
        renderCards(filtered);
    }

    // Load Data
    fetchFirmware();
</script>

</body>
</html>
