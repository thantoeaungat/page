<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TTA</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #ffffff;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            width: 350px;
        }
        h2 {
            margin-top: 0;
            color: #333;
            text-align: center;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #666;
            font-weight: bold;
        }
        
        /* Input နဲ့ Icon ခလုတ်များ ဘေးချင်းယှဉ်ရန် */
        .input-wrapper {
            display: flex;
            gap: 6px;
            align-items: center;
        }
        input[type="text"] {
            flex: 1;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        /* Icon ခလုတ်များအတွက် Style */
        .btn-icon {
            width: 34px;
            height: 34px;
            padding: 0;
            border: 1px solid #ccc;
            border-radius: 4px;
            background-color: #f8f9fa;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background-color 0.2s;
        }
        .btn-icon:hover {
            background-color: #e2e6ea;
        }
        .btn-icon svg {
            width: 16px;
            height: 16px;
            fill: #495057;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .btn-action {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            color: white;
            font-weight: bold;
        }
        .btn-generate { background-color: #007bff; }
        .btn-generate:hover { background-color: #0056b3; }
        .btn-copy { background-color: #28a745; }
        .btn-copy:hover { background-color: #218838; }
        .btn-clear { background-color: #dc3545; }
        .btn-clear:hover { background-color: #c82333; }
    </style>
</head>
<body>

<div class="container">
    <h2>TTA Generator</h2>
    
    <div class="form-group">
        <label for="hardwareId">Hardware ID:</label>
        <div class="input-wrapper">
            <input type="text" id="hardwareId" placeholder="Enter Hardware ID">
            <!-- Paste Icon Button -->
            <button type="button" class="btn-icon" onclick="pasteHardwareId()" title="Paste from Clipboard">
                <svg viewBox="0 0 24 24">
                    <path d="M19 2h-4.18C14.4 0.84 13.3 0 12 0c-1.3 0-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zm7 18H5V4h2v3h10V4h2v16z"/>
                </svg>
            </button>
        </div>
    </div>

    <div class="form-group">
        <label for="generatedKey">Generated License Key:</label>
        <input type="text" id="generatedKey" readonly placeholder="Key will appear here">
    </div>

    <div class="btn-group">
        <button class="btn-action btn-generate" onclick="generateKey()">Generate</button>
        <button class="btn-action btn-copy" onclick="copyKey()">Copy Key</button>
        <button class="btn-action btn-clear" onclick="clearAll()" title="Clear Inputs">Clear</button>
    </div>
</div>

<script>
    // SHA-256 Hash တွက်ချက်ပေးမည့် async function
    async function sha256(message) {
        const msgBuffer = new TextEncoder().encode(message);
        const hashBuffer = await crypto.subtle.digest('SHA-256', msgBuffer);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0').toUpperCase()).join('');
        return hashHex;
    }

    async function generateKey() {
        const hardwareId = document.getElementById("hardwareId").value.trim();

        if (!hardwareId) {
            alert("Please enter Hardware ID!");
            return;
        }

        const secretSalt = "AdbRunnerSuperKey2026";
        const rawData = hardwareId + secretSalt;

        const fullHash = await sha256(rawData);
        const key20Length = fullHash.substring(0, 20);

        document.getElementById("generatedKey").value = key20Length;
    }

    function copyKey() {
        const keyText = document.getElementById("generatedKey").value;

        if (keyText) {
            navigator.clipboard.writeText(keyText).then(() => {
                alert("License Key copied to clipboard!");
            }).catch(err => {
                alert("Failed to copy text: " + err);
            });
        } else {
            alert("No key to copy!");
        }
    }

    // Clipboard မှ စာသားကို တိုက်ရိုက် Paste လုပ်ပေးမည့် function
    async function pasteHardwareId() {
        try {
            const text = await navigator.clipboard.readText();
            document.getElementById("hardwareId").value = text;
        } catch (err) {
            alert("Failed to paste from clipboard. Please allow clipboard permissions.");
        }
    }

    // Input fields များကို ရှင်းထုတ်ပေးမည့် function
    function clearAll() {
        document.getElementById("hardwareId").value = "";
        document.getElementById("generatedKey").value = "";
    }
</script>

</body>
</html>
