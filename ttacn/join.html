<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TCF Tool Register Account</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f4f6f9;
        }
        .card {
            background: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 350px;
        }
        .card h2 {
            margin-bottom: 20px;
            color: #333;
            text-align: center;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-size: 14px;
        }
        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            outline: none;
            font-size: 14px;
        }
        .form-group input:focus {
            border-color: #007bff;
        }
        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s ease;
        }
        .btn-submit:hover {
            background-color: #0056b3;
        }
        .btn-submit:disabled {
            background-color: #a0c8f0;
            cursor: not-allowed;
        }
        .login-link-container {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
            color: #666;
        }
        .btn-login {
            display: inline-block;
            margin-top: 5px;
            width: 100%;
            padding: 10px;
            background-color: #28a745;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-size: 15px;
            text-align: center;
            transition: background 0.3s ease;
        }
        .btn-login:hover {
            background-color: #218838;
        }
        #message {
            margin-top: 15px;
            font-size: 14px;
            font-weight: bold;
            text-align: center;
            line-height: 1.4;
        }
        .success { color: #28a745; }
        .error { color: #dc3545; }
        .processing { color: #ffc107; }
    </style>
</head>
<body>

<div class="card">
    <h2>TCF Tool Register</h2>
    <form id="registerForm">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" required placeholder="Enter username">
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" required placeholder="Enter password">
        </div>
        <div class="form-group">
            <label for="gmail">Gmail</label>
            <input type="email" id="gmail" required placeholder="Enter gmail">
        </div>
        <button type="submit" class="btn-submit" id="submitBtn">Register</button>
    </form>
    
    <div id="message"></div>

    <div class="login-link-container">
        <p>Already have an account?</p>
        <a href="http://www.ttamig3.com/ttacn/login.html" class="btn-login">Login Here</a>
    </div>
</div>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbxa_XQg0fif-3OfAeRrsZqmlio670UGTLC0GlgThsEGq5kFhmKTWyeP5-2KXD4go8JkXQ/exec';

    document.getElementById('registerForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const messageDiv = document.getElementById('message');
        const submitBtn = document.getElementById('submitBtn');
        
        // Processing State
        messageDiv.className = 'processing';
        messageDiv.innerText = 'Registering account... Please wait.';
        submitBtn.disabled = true;

        const formData = new URLSearchParams();
        formData.append('action', 'register'); 
        formData.append('username', document.getElementById('username').value.trim());
        formData.append('password', document.getElementById('password').value.trim());
        formData.append('gmail', document.getElementById('gmail').value.trim());

        fetch(scriptURL, {
            method: 'POST',
            body: formData
        })
        .then(response => response.json())
        .then(res => {
            submitBtn.disabled = false;
            if (res.status === 'success') {
                messageDiv.className = 'success';
                messageDiv.innerText = res.message || 'Registration successful! Your account is now active.';
                document.getElementById('registerForm').reset();
            } else {
                messageDiv.className = 'error';
                messageDiv.innerText = res.message || 'Registration failed. Please try again.';
            }
        })
        .catch(error => {
            console.error('Error:', error);
            submitBtn.disabled = false;
            messageDiv.className = 'error';
            messageDiv.innerText = 'Something went wrong. Please check your connection!';
        });
    });
</script>

</body>
</html>
