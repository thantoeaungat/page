<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Account</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f4f6f9;
        }
        .card {
            background: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 350px;
        }
        .card h2 {
            margin-bottom: 20px;
            color: #333;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-size: 14px;
        }
        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            outline: none;
            font-size: 14px;
        }
        .form-group input:focus {
            border-color: #007bff;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background 0.3s ease;
        }
        button:hover {
            background-color: #0056b3;
        }
        #message {
            margin-top: 15px;
            font-size: 14px;
            font-weight: bold;
            text-align: center;
        }
        .success { color: green; }
        .error { color: red; }
    </style>
</head>
<body>

<div class="card">
    <h2>Register</h2>
    <form id="registerForm">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" required placeholder="Enter username">
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" required placeholder="Enter password">
        </div>
        <div class="form-group">
            <label for="gmail">Gmail</label>
            <input type="email" id="gmail" required placeholder="Enter gmail">
        </div>
        <button type="submit">Register</button>
    </form>
    <div id="message"></div>
</div>

<script>
    // သင်၏ Google Apps Script Web App URL ကို ဤနေရာတွင် အစားထိုးပါ
    const scriptURL = 'https://script.google.com/macros/s/AKfycbze4V289S25H9kZAL4e_FK7jhaasmGuE9wwZFSgCw4P065uH_u_K5CmkAurpDWwkzKG2w/exec';

    document.getElementById('registerForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const messageDiv = document.getElementById('message');
        messageDiv.className = '';
        messageDiv.innerText = 'Processing...';

        // URLSearchParams သုံးပြီး Google Sheet ဆီ Form Data အဖြစ် ပို့ဆောင်ခြင်း
        const formData = new URLSearchParams();
        formData.append('action', 'register'); // action parameter မဖြစ်မနေ ထည့်ရမည်
        formData.append('username', document.getElementById('username').value.trim());
        formData.append('password', document.getElementById('password').value.trim());
        formData.append('gmail', document.getElementById('gmail').value.trim());

        fetch(scriptURL, {
            method: 'POST',
            body: formData
        })
        .then(response => response.json())
        .then(res => {
            if (res.status === 'success') {
                messageDiv.className = 'success';
                messageDiv.innerText = res.message;
                document.getElementById('registerForm').reset();
            } else {
                messageDiv.className = 'error';
                messageDiv.innerText = res.message;
            }
        })
        .catch(error => {
            console.error('Error:', error);
            messageDiv.className = 'error';
            messageDiv.innerText = 'Something went wrong. Please try again!';
        });
    });
</script>

</body>
</html>
